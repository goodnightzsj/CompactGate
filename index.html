<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CompactGate Studio</title>
    <script>
      // Blocks paint on purpose. The theme used to be applied from an effect,
      // which runs after the first paint: every dark load flashed the light
      // palette, and the :root[data-theme] overrides missed that frame too.
      // Keep in sync with src/ui/hooks/useThemeMode.ts.
      (function () {
        var stored = null;
        try {
          stored = window.localStorage.getItem("compactgate-theme-mode");
        } catch (error) {
          stored = null;
        }

        var mode = stored === "light" || stored === "dark" || stored === "auto" ? stored : "auto";
        var resolved = mode === "auto"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : mode;
        var root = document.documentElement;
        root.dataset.themeMode = mode;
        root.dataset.theme = resolved;
        root.style.colorScheme = resolved;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", resolved === "dark" ? "#16181b" : "#faf8f3");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/App.tsx"></script>
  </body>
</html>
